<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東京 7 日 6 夜 旅行</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4">

  <header class="max-w-md mx-auto flex justify-between items-center mb-4">
    <div>
      <h1 class="text-xl font-bold text-amber-400">⛩️ 東京孝親 7 天行</h1>
      <p id="sync-status" class="text-xs text-slate-400 mt-1">⚡ 載入中...</p>
    </div>
    <button onclick="fetchLatestData()" class="bg-slate-800 border border-slate-700 text-xs px-3 py-2 rounded-xl">
      🔄 重新同步
    </button>
  </header>

  <!-- Day 選單 -->
  <nav id="day-tabs" class="max-w-md mx-auto flex gap-2 overflow-x-auto pb-2 mb-4"></nav>

  <!-- 時間軸區域 -->
  <main id="timeline-container" class="max-w-md mx-auto space-y-3"></main>

  <script>
    // ⚙️ 請貼上您的 GAS Web App API 網址 (注意雙引號)
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwYZib81VOZqyDWyrvVd_h6QrRmJFU_z9mlAXYynE9yOd5my_EKrcQMgGNQe_WPjczEPg/exec";

    let currentData = null;
    let selectedDayIndex = 0;

    async function fetchLatestData() {
      const statusEl = document.getElementById('sync-status');
      statusEl.textContent = "🔄 正在讀取最新資料...";
      try {
        const res = await fetch(GAS_API_URL);
        const json = await res.json();
        if (json.status === 'success') {
          currentData = json;
          statusEl.textContent = `✅ 已同步 (${json.updatedAt})`;
          renderApp();
        } else {
          throw new Error(json.message);
        }
      } catch (err) {
        statusEl.textContent = `❌ 同步失敗: ${err.message}`;
      }
    }

    function renderApp() {
      if (!currentData || !currentData.schedule || !currentData.schedule.days.length) {
        document.getElementById('timeline-container').innerHTML = '<div class="text-center text-slate-500 py-10">尚無行程資料</div>';
        return;
      }

      const days = currentData.schedule.days;
      const tabsNav = document.getElementById('day-tabs');
      tabsNav.innerHTML = days.map((day, idx) => `
        <button onclick="selectDay(${idx})" class="px-3 py-1.5 text-xs font-bold rounded-lg whitespace-nowrap transition ${
          idx === selectedDayIndex ? 'bg-amber-400 text-slate-950' : 'bg-slate-900 border border-slate-800 text-slate-300'
        }">
          DAY ${idx + 1} (${day.slice(5)})
        </button>
      `).join('');

      renderTimeline(days[selectedDayIndex]);
    }

    function selectDay(index) {
      selectedDayIndex = index;
      renderApp();
    }

    function renderTimeline(currentDayKey) {
      const container = document.getElementById('timeline-container');
      const timeline = currentData.schedule.timeline;
      
      const dayItems = timeline.filter(slot => slot.items[currentDayKey]);

      if (dayItems.length === 0) {
        container.innerHTML = '<div class="text-center text-slate-400 py-10">☕ 本日尚無排定行程</div>';
        return;
      }

      container.innerHTML = dayItems.map(slot => {
        const itemName = slot.items[currentDayKey];
        const detail = (currentData.restaurants && currentData.restaurants[itemName]) || 
                       (currentData.attractions && currentData.attractions[itemName]) || {};

        return `
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex gap-4 items-center">
            <div class="text-sm font-bold text-amber-400 border-r border-slate-800 pr-3 w-16 text-center">
              ${slot.time}
            </div>
            <div class="flex-1">
              <div class="text-lg font-bold text-white">${itemName}</div>
              ${detail.District ? `<span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded mt-1.5 inline-block">${detail.District}</span>` : ''}
              ${detail.AvgCost ? `<span class="text-sm text-slate-400 ml-2">消費: ¥${detail.AvgCost}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    window.addEventListener('DOMContentLoaded', fetchLatestData);
  </script>
</body>
</html>
