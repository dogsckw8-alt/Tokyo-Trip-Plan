<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東京 7 日 6 夜旅行 v3.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-card:active {
      transform: scale(0.98);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 select-none">

  <!-- 頂部 Header -->
  <header class="sticky top-0 bg-slate-950/95 backdrop-blur-md z-30 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-black text-amber-400 tracking-wide">⛩️ 東京 7 日 6 夜旅行</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="fetchLatestData()" class="flex items-center gap-1.5 bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-full active:scale-95 transition">
        <span id="sync-dot" class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="sync-text" class="text-xs text-slate-300 font-bold">已同步</span>
      </button>
    </div>
  </header>

  <!-- 日期導航列 -->
  <nav class="sticky top-[57px] bg-slate-950/95 backdrop-blur-md z-20 px-3 py-2 border-b border-slate-800">
    <div id="day-tabs" class="flex gap-2.5 overflow-x-auto no-scrollbar pb-1">
      <!-- 由 JS 動態生成 -->
    </div>
  </nav>

  <!-- 第一層：貫穿式時間軸與極簡卡片 -->
  <main class="max-w-md mx-auto px-4 pt-6 relative">
    <div class="absolute left-[39px] top-6 bottom-6 w-1 bg-slate-800 z-0"></div>
    <div id="timeline-container" class="space-y-6 relative z-10">
      <!-- 由 JS 動態生成 -->
    </div>
  </main>

  <!-- 第二層： Bottom Sheet Modal (時刻表/影片/導航鏈/SubSpots 微型時間軸) -->
  <div id="modal-overlay" class="fixed inset-0 bg-black/80 z-40 flex flex-col justify-end hidden opacity-0 transition-opacity duration-200" onclick="closeModal(event)">
    <div id="modal-sheet" class="bg-slate-900 border-t border-slate-700 rounded-t-3xl max-h-[90vh] flex flex-col overflow-hidden transform translate-y-full transition-transform duration-300 shadow-2xl" onclick="event.stopPropagation()">

      <!-- 可滾動內容主體 -->
      <div class="p-5 space-y-5 overflow-y-auto flex-1">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <div id="modal-back-btn-container"></div>
          <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto"></div>
          <button onclick="closeModalDirect()" class="text-slate-400 hover:text-white p-1 text-2xl font-bold">✕</button>
        </div>

        <!-- Header & Image Banner -->
        <div id="modal-header" class="space-y-2"></div>

        <!-- 核心網格資訊 -->
        <div id="modal-grid" class="grid grid-cols-2 gap-3 text-slate-200"></div>

        <!-- 轉乘/行程分段明細（交通專用微型時間軸） -->
        <div id="modal-transit-steps" class="space-y-4 hidden"></div>

        <!-- 高亮提醒、故事、SubSpots 散步路線微型時間軸、順遊下一站區域 -->
        <div id="modal-alerts" class="space-y-3"></div>
      </div>

      <!-- 吸底動作按鈕列 -->
      <div id="modal-actions" class="p-4 bg-slate-900 border-t border-slate-800 flex gap-3 z-10 flex-shrink-0"></div>
    </div>
  </div>

  <!-- 第三層：Lightbox 全螢幕圖片預覽 Modal -->
  <div id="lightbox-overlay" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200 p-4" onclick="closeLightbox()">
    <button onclick="closeLightbox()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-3xl font-bold z-50 p-2 bg-slate-900/80 rounded-full w-12 h-12 flex items-center justify-center border border-slate-700">✕</button>
    <div class="relative max-w-full max-h-full flex items-center justify-center" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="圖片預覽" class="max-w-full max-h-[85vh] rounded-2xl object-contain shadow-2xl transform scale-95 transition-transform duration-200 border border-slate-800">
      <div id="lightbox-caption" class="absolute bottom-[-2.5rem] text-center text-sm font-bold text-slate-300 bg-slate-900/90 px-4 py-1.5 rounded-full border border-slate-700"></div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "myapi";

    let currentData = null;
    let selectedDayIndex = 0;
    let modalHistory = [];
    let currentModalItem = null;

    const WEEK_DAYS = ['(日)', '(一)', '(二)', '(三)', '(四)', '(五)', '(六)'];
    const WEEK_KEYS = ['日', '一', '二', '三', '四', '五', '六'];

    async function fetchLatestData() {
      const dotEl = document.getElementById('sync-dot');
      const textEl = document.getElementById('sync-text');
      dotEl.className = "w-3 h-3 rounded-full bg-amber-400 animate-ping";
      textEl.textContent = "讀取中...";

      try {
        const res = await fetch(GAS_API_URL);
        const json = await res.json();
        if (json.status === 'success') {
          currentData = json;
          dotEl.className = "w-3 h-3 rounded-full bg-emerald-400";
          textEl.textContent = "已同步";
          renderApp();
        } else {
          throw new Error(json.message);
        }
      } catch (err) {
        dotEl.className = "w-3 h-3 rounded-full bg-rose-500";
        textEl.textContent = "同步失敗";
        console.error(err);
      }
    }

    function renderApp() {
      if (!currentData || !currentData.schedule || !currentData.schedule.days.length) {
        document.getElementById('timeline-container').innerHTML = '<div class="text-center text-slate-400 py-12 text-lg">尚無行程資料</div>';
        return;
      }

      const days = currentData.schedule.days;
      const tabsNav = document.getElementById('day-tabs');
      tabsNav.innerHTML = days.map((dayStr, idx) => {
        const dateObj = new Date(dayStr);
        const dateShort = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
        const weekDay = WEEK_DAYS[dateObj.getDay()] || '';
        const isSelected = idx === selectedDayIndex;

        return `
          <button onclick="selectDay(${idx})" class="flex-shrink-0 px-4 py-2 rounded-2xl flex flex-col items-center transition-all ${
            isSelected 
              ? 'bg-amber-400 text-slate-950 font-black shadow-lg shadow-amber-400/20 scale-105' 
              : 'bg-slate-900 border border-slate-800 text-slate-300 font-bold'
          }">
            <span class="text-xs tracking-wider opacity-80">DAY ${idx + 1}</span>
            <span class="text-base font-black">${dateShort} ${weekDay}</span>
          </button>
        `;
      }).join('');

      renderTimeline(days[selectedDayIndex]);
    }

    function selectDay(index) {
      selectedDayIndex = index;
      renderApp();
    }

    function getCleanSpotName(rawName) {
      if (!rawName) return '';
      return rawName.split('|')[0].trim();
    }

    function parseDurationMins(durationVal) {
      if (!durationVal) return 60;
      const str = String(durationVal).trim();
      if (!str) return 60;
      if (str.includes('h') || str.includes('時')) {
        const num = parseFloat(str);
        return isNaN(num) ? 60 : Math.round(num * 60);
      }
      const match = str.match(/\d+/);
      return match ? parseInt(match[0], 10) : 60;
    }

    function formatMins(rawVal) {
      if (!rawVal && rawVal !== 0) return '移動中';
      const str = String(rawVal).trim();
      if (!str) return '移動中';
      if (str.toLowerCase().includes('min')) return str;
      return `${str} mins`;
    }

    function formatFeeDisplay(rawFee) {
      if (!rawFee && rawFee !== 0) return '';
      const str = String(rawFee).trim();
      if (str === '0' || str.toLowerCase().includes('pass') || str.includes('免')) {
        return '<span class="bg-emerald-950/80 border border-emerald-800 text-emerald-300 px-2 py-0.5 rounded-md text-xs font-bold">🎫 Pass涵蓋 (¥0)</span>';
      }
      const numMatch = str.match(/\d+/);
      const val = numMatch ? numMatch[0] : str;
      return `<span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-md text-xs font-bold">💰 ¥${val}</span>`;
    }

    function formatHoursDisplay(hoursStr) {
      if (!hoursStr) return '請參考官方說明';
      const str = String(hoursStr).trim();
      if (!str) return '請參考官方說明';
      return str.replace(/(\d{1,2}:\d{2}\s*[-~～]\s*\d{1,2}:\d{2})[\s,;/]+(\d{1,2}:\d{2}\s*[-~～]\s*\d{1,2}:\d{2})/g, '$1\n$2');
    }

    /* ----------------------------------------------------
       增強型 SubSpots 解析器 (時間戳記 + 特色標籤)
    ---------------------------------------------------- */
    function parseSubSpots(subSpotsStr) {
      if (!subSpotsStr) return [];
      const rawList = String(subSpotsStr).split(/\||\n/).map(s => s.trim()).filter(Boolean);

      return rawList.map(itemStr => {
        let time = '';
        let name = itemStr;
        let badges = [];

        // 1. 提昇時間戳記 (例如: 17:15 銀座中央通...)
        const timeMatch = name.match(/^(\d{1,2}:\d{2}(?:\s*[-~～]\s*\d{1,2}:\d{2})?)\s+/);
        if (timeMatch) {
          time = timeMatch[1];
          name = name.replace(timeMatch[0], '').trim();
        }

        // 2. 提昇特色標籤 (例如: 新丸大樓7F[觀景台/免費])
        const badgeMatch = name.match(/\[(.*?)\]/);
        if (badgeMatch) {
          badges = badgeMatch[1].split(/[,，/]/).map(b => b.trim()).filter(Boolean);
          name = name.replace(/\[.*?\]/, '').trim();
        }

        return { time, name, badges, raw: itemStr };
      });
    }

    /* LocalStorage 踏實通關狀態管理 */
    function getSubspotCheckKey(parentSpot, subspotName) {
      return `subspot_check_${parentSpot}_${subspotName}`;
    }

    function toggleSubspotCheck(parentSpot, subspotName, checkboxEl) {
      const isChecked = checkboxEl.checked;
      const key = getSubspotCheckKey(parentSpot, subspotName);
      localStorage.setItem(key, isChecked ? 'true' : 'false');

      const labelEl = document.getElementById(`subspot-label-${parentSpot}-${subspotName}`);
      if (labelEl) {
        if (isChecked) {
          labelEl.classList.add('line-through', 'text-slate-500');
          labelEl.classList.remove('text-slate-100');
        } else {
          labelEl.classList.remove('line-through', 'text-slate-500');
          labelEl.classList.add('text-slate-100');
        }
      }
    }

    /* 自動合成 Google Walking Route 多站點導航網址 */
    function buildContinuousMapUrl(parentSpot, subSpots) {
      if (!subSpots || subSpots.length === 0) {
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(parentSpot)}`;
      }
      const names = subSpots.map(s => s.name);
      if (names.length === 1) {
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(names[0])}`;
      }
      const origin = encodeURIComponent(names[0]);
      const destination = encodeURIComponent(names[names.length - 1]);
      const waypoints = names.slice(1, -1).map(n => encodeURIComponent(n)).join('%7C');
      let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=walking`;
      if (waypoints) {
        url += `&waypoints=${waypoints}`;
      }
      return url;
    }

    function parseCellContent(rawString) {
      if (!rawString) return { spotName: '', subTitle: '', notice: '' };
      const parts = rawString.split('|').map(s => s.trim());
      return { spotName: parts[0] || '', subTitle: parts[1] || '', notice: parts.slice(2).join(' ') || '' };
    }

    function getItemIcon(type, name) {
      if (!type) {
        if (name.includes('機場')) return '✈️';
        if (name.includes('點燈') || name.includes('聖誕') || name.includes('市集')) return '🎄';
        if (name.includes('酒店') || name.includes('飯店')) return '🏨';
        return '📍';
      }
      if (type.includes('點燈') || type.includes('聖誕')) return '✨';
      if (type.includes('Hotel') || type.includes('飯店')) return '🏨';
      if (type.includes('餐廳') || type.includes('燒肉')) return '🍴';
      if (type.includes('Spot') || type.includes('景點')) return '⛩️';
      return '📍';
    }

    /* ----------------------------------------------------
       第一層：極簡時間軸卡片 (Minimalist Timeline)
    ---------------------------------------------------- */
    function renderTimeline(currentDayKey) {
      const container = document.getElementById('timeline-container');
      const timeline = currentData.schedule.timeline;
      const dayItems = timeline.filter(slot => slot.items[currentDayKey]);

      if (dayItems.length === 0) {
        container.innerHTML = '<div class="text-center text-slate-400 py-12 text-lg">☕ 本日尚無排定行程</div>';
        return;
      }

      container.innerHTML = dayItems.map((slot) => {
        const rawName = slot.items[currentDayKey];
        const isTransport = rawName.includes('→') || rawName.includes('➔');

        if (isTransport) {
          const cleanRoute = getCleanSpotName(rawName);
          const routeParts = cleanRoute.split(/→|➔/).map(p => p.trim());
          const transInfo = (currentData.transports && currentData.transports[cleanRoute]) || {};
          const durationStr = formatMins(transInfo.Time || transInfo.Duration);
          const feeBadge = formatFeeDisplay(transInfo.Fee);

          return `
            <div class="flex items-start gap-3 relative z-10">
              <div class="w-12 pt-2 flex-shrink-0 text-right">
                <span class="text-xs font-black text-amber-400 bg-slate-900 px-1 py-0.5 rounded border border-amber-500/30">${slot.time}</span>
              </div>
              <div onclick="openTransportModal('${cleanRoute}')" class="touch-card flex-1 bg-slate-900/90 border border-amber-500/40 p-3 rounded-2xl cursor-pointer transition active:scale-[0.98]">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <span class="text-lg">🚌</span>
                    <h3 class="text-sm font-black text-amber-300">${routeParts.join(' ➔ ')}</h3>
                  </div>
                </div>
                <div class="flex items-center gap-2 mt-1.5 text-xs font-bold text-slate-300">
                  <span class="bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-md">⏱️ ${durationStr}</span>
                  ${feeBadge}
                </div>
              </div>
            </div>
          `;
        }

        const parsedNotice = parseCellContent(rawName);
        const { spotName, subTitle } = parsedNotice;
        const dbItem = (currentData.restaurants && currentData.restaurants[spotName]) || 
                       (currentData.attractions && currentData.attractions[spotName]) || {};

        const icon = getItemIcon(dbItem.Type || dbItem['Rest.Type'], spotName);
        const subSpotsList = parseSubSpots(dbItem.SubSpots);
        const durationMins = parseDurationMins(dbItem.Duration);

        return `
          <div class="flex items-start gap-3 relative z-10">
            <div class="w-12 pt-2 flex-shrink-0 text-right">
              <span class="text-xs font-extrabold text-amber-400 block">${slot.time}</span>
            </div>
            <div onclick="openDetailModal('${spotName}', '${slot.time}')" class="touch-card flex-1 bg-slate-900 border border-slate-800 p-3.5 rounded-2xl cursor-pointer transition active:scale-[0.98]">
              <div class="flex items-center justify-between gap-2">
                <h2 class="text-base font-black text-white leading-snug flex items-center gap-1.5">
                  <span>${icon}</span>
                  <span>${spotName}</span>
                </h2>
                ${dbItem.District ? `<span class="text-xs font-bold text-slate-400 flex-shrink-0">📍 ${dbItem.District}</span>` : ''}
              </div>
              ${subTitle ? `<p class="text-xs text-slate-400 mt-1 font-medium truncate">${subTitle}</p>` : ''}
              
              <!-- 概覽標籤膠囊 -->
              <div class="flex flex-wrap items-center gap-1.5 mt-2 pt-2 border-t border-slate-800/80">
                <span class="bg-indigo-950/80 text-indigo-300 border border-indigo-800/60 text-xs font-bold px-2 py-0.5 rounded-md">⏱️ ${durationMins}m</span>
                ${dbItem.AvgCost !== undefined ? `<span class="bg-slate-800 text-amber-300 text-xs font-bold px-2 py-0.5 rounded-md">💰 ${dbItem.AvgCost == 0 ? '免費' : '¥' + dbItem.AvgCost}</span>` : ''}
                ${subSpotsList.length > 0 ? `<span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs font-bold px-2 py-0.5 rounded-md">✨ ${subSpotsList.length} 大景點/打卡點</span>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    /* ----------------------------------------------------
       第二層：多功能 Modal (景點/散步路線詳情)
    ---------------------------------------------------- */
    function openDetailModal(itemName, slotTime = '', isBackNavigation = false) {
      if (!isBackNavigation && currentModalItem && currentModalItem !== itemName) {
        modalHistory.push(currentModalItem);
      }
      currentModalItem = itemName;

      const dbItem = (currentData.restaurants && currentData.restaurants[itemName]) || 
                     (currentData.attractions && currentData.attractions[itemName]) || {};

      const icon = getItemIcon(dbItem.Type || dbItem['Rest.Type'], itemName);
      const imageUrl = dbItem.ImageURL || dbItem.ImgURL || dbItem.Photo || dbItem.Pic;
      const subSpots = parseSubSpots(dbItem.SubSpots);

      // 返回上一頁按鈕 ( Modal History Stack )
      const backBtnContainer = document.getElementById('modal-back-btn-container');
      if (modalHistory.length > 0) {
        const prevItem = modalHistory[modalHistory.length - 1];
        backBtnContainer.innerHTML = `
          <button onclick="popModalHistory()" class="text-xs text-amber-400 font-bold bg-amber-500/10 border border-amber-500/30 px-2.5 py-1 rounded-lg hover:bg-amber-500/20 transition flex items-center gap-1">
            ⬅️ 返回 ${prevItem}
          </button>
        `;
      } else {
        backBtnContainer.innerHTML = '';
      }

      document.getElementById('modal-transit-steps').classList.add('hidden');

      // Modal Header
      document.getElementById('modal-header').innerHTML = `
        ${imageUrl ? `
          <div class="overflow-hidden rounded-2xl mb-2 border border-slate-700 max-h-48 relative group cursor-pointer" onclick="openLightbox('${imageUrl}', '${itemName}')">
            <img src="${imageUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${itemName}">
            <div class="absolute bottom-2 right-2 bg-slate-900/80 backdrop-blur-sm text-slate-200 text-xs px-2.5 py-1 rounded-lg border border-slate-700 flex items-center gap-1 font-bold">📷 預覽相簿</div>
          </div>
        ` : ''}
        <div class="flex items-center gap-2">
          <span class="text-3xl">${icon}</span>
          <div>
            <h2 class="text-2xl font-black text-white leading-tight">${itemName}</h2>
            ${dbItem.Type ? `<span class="text-xs text-amber-400 font-bold">${dbItem.Type}</span>` : ''}
          </div>
        </div>
      `;

      // 核心網格
      document.getElementById('modal-grid').innerHTML = `
        <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
          <p class="text-xs text-slate-400 font-bold">📍 所屬區域</p>
          <p class="text-base font-black text-white mt-0.5">${dbItem.District || '東京'}</p>
        </div>
        <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
          <p class="text-xs text-slate-400 font-bold">⏱️ 建議停留</p>
          <p class="text-base font-black text-amber-300 mt-0.5">${parseDurationMins(dbItem.Duration)} mins</p>
        </div>
      `;

      // 重點提醒與 SubSpots 微型時間軸 (Micro-Timeline)
      let alertHTML = '';

      if (subSpots.length > 0) {
        alertHTML += `
          <div class="bg-indigo-950/40 border border-indigo-800/80 p-4 rounded-2xl space-y-3">
            <div class="flex items-center justify-between border-b border-indigo-800/60 pb-2">
              <p class="text-xs font-black text-indigo-300 uppercase tracking-wider flex items-center gap-1.5">
                <span>🗺️</span>
                <span>散步路線微型時間軸 (${subSpots.length} 個站點)</span>
              </p>
              <span class="text-[10px] text-slate-400 font-bold">可勾選踩點進度</span>
            </div>
            
            <div class="relative pl-4 space-y-4 before:absolute before:left-1.5 before:top-2 before:bottom-2 before:w-0.5 before:bg-indigo-500/40">
              ${subSpots.map((spot, i) => {
                const subDb = (currentData.restaurants && currentData.restaurants[spot.name]) || 
                              (currentData.attractions && currentData.attractions[spot.name]) || {};
                const hasDbData = Object.keys(subDb).length > 0;
                const subMapUrl = subDb.Gmap_URL || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.name)}`;
                const subImgUrl = subDb.ImageURL || subDb.Photo;
                
                const isChecked = localStorage.getItem(getSubspotCheckKey(itemName, spot.name)) === 'true';

                return `
                  <div class="relative flex items-start justify-between gap-2 bg-slate-900/90 border border-slate-800 p-3 rounded-xl hover:border-slate-700 transition">
                    <!-- 時間軸圓點 -->
                    <div class="absolute -left-[21px] top-3.5 w-2.5 h-2.5 rounded-full bg-amber-400 ring-4 ring-slate-950"></div>

                    <div class="flex items-start gap-2.5 flex-1">
                      <input type="checkbox" id="spot-chk-${i}" ${isChecked ? 'checked' : ''} onchange="toggleSubspotCheck('${itemName}', '${spot.name}', this)" class="w-4 h-4 mt-1 accent-amber-400 rounded cursor-pointer flex-shrink-0">
                      <div>
                        <div class="flex items-center gap-2 flex-wrap">
                          ${spot.time ? `<span class="text-xs font-black text-amber-300 bg-amber-500/20 px-2 py-0.5 rounded-md border border-amber-500/30">${spot.time}</span>` : ''}
                          <label id="subspot-label-${itemName}-${spot.name}" for="spot-chk-${i}" class="text-sm font-black cursor-pointer leading-snug ${isChecked ? 'line-through text-slate-500' : 'text-slate-100'}">
                            ${spot.name}
                          </label>
                        </div>

                        <!-- 特色屬性標籤 (Badges) -->
                        ${spot.badges.length > 0 ? `
                          <div class="flex flex-wrap gap-1 mt-1.5">
                            ${spot.badges.map(b => `<span class="bg-indigo-900/80 text-indigo-200 border border-indigo-700/60 text-[10px] font-bold px-1.5 py-0.5 rounded">${b}</span>`).join('')}
                          </div>
                        ` : ''}
                      </div>
                    </div>
                    
                    <div class="flex items-center gap-1 flex-shrink-0">
                      <a href="${subMapUrl}" target="_blank" class="text-[11px] text-amber-400 font-bold bg-amber-500/10 border border-amber-500/30 px-2 py-1 rounded-md hover:bg-amber-500/20 transition">📍</a>
                      ${subImgUrl ? `<button onclick="openLightbox('${subImgUrl}', '${spot.name}')" class="text-[11px] text-sky-300 font-bold bg-sky-950/80 border border-sky-800 px-2 py-1 rounded-md">🖼️</button>` : ''}
                      ${hasDbData ? `<button onclick="openDetailModal('${spot.name}')" class="text-[11px] text-slate-300 font-bold bg-slate-800 border border-slate-700 px-2 py-1 rounded-md">🔍</button>` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      if (dbItem.Comment || dbItem.Notes) {
        alertHTML += `
          <div class="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700/80">
            <p class="text-xs font-bold text-slate-400">📝 路線備註與提醒</p>
            <p class="text-sm font-bold text-slate-200 mt-1 leading-relaxed whitespace-pre-line">${dbItem.Comment || dbItem.Notes}</p>
          </div>
        `;
      }

      document.getElementById('modal-alerts').innerHTML = alertHTML;

      // 按鈕鏈：全程導航
      const continuousMapUrl = dbItem.Gmap_URL || buildContinuousMapUrl(itemName, subSpots);
      const actionsEl = document.getElementById('modal-actions');
      actionsEl.classList.remove('hidden');
      actionsEl.innerHTML = `
        <a href="${continuousMapUrl}" target="_blank" class="flex-1 h-12 bg-amber-400 text-slate-950 font-black text-base rounded-xl flex items-center justify-center gap-2 shadow-lg active:scale-95 transition">
          <span>🗺️</span>
          <span>載入全程散步導航 (Google Maps)</span>
        </a>
      `;

      showModal();
    }

    function popModalHistory() {
      if (modalHistory.length > 0) {
        const prevItem = modalHistory.pop();
        openDetailModal(prevItem, '', true);
      }
    }

    /* ----------------------------------------------------
       第二層：交通路線 Modal (特定班次標準化)
    ---------------------------------------------------- */
    function openTransportModal(fullRoute) {
      const routeParts = fullRoute.split(/→|➔/).map(p => p.trim());
      const transInfo = (currentData && currentData.transports && currentData.transports[fullRoute]) || {};

      document.getElementById('modal-header').innerHTML = `
        <h2 class="text-2xl font-black text-white flex items-center gap-2"><span>🚌</span> 路線指南</h2>
        <p class="text-lg text-amber-400 font-extrabold mt-1">${routeParts.join(' ➔ ')}</p>
      `;

      // 班次分隔化解析 (相容逗號、斜線與換行)
      const rawTimetable = transInfo.Timetable || transInfo['特定班次'] || '';
      const timetables = rawTimetable.split(/[,，/\n]/).map(t => t.trim()).filter(Boolean);

      const stepsContainer = document.getElementById('modal-transit-steps');
      stepsContainer.classList.remove('hidden');
      stepsContainer.innerHTML = `
        <div class="bg-slate-800/90 border border-slate-700 p-4 rounded-2xl space-y-3">
          <div class="flex justify-between items-center border-b border-slate-700/80 pb-2">
            <span class="text-xs font-black bg-amber-500/20 text-amber-300 px-2.5 py-0.5 rounded-md">移動接駁</span>
            <span class="text-xs font-bold text-slate-300">⏱️ ${formatMins(transInfo.Time || transInfo.Duration)}</span>
          </div>

          ${timetables.length > 0 ? `
            <div class="pt-1">
              <p class="text-xs font-bold text-slate-300 mb-1.5">⏰ 建議特定班次：</p>
              <div class="flex flex-wrap gap-1.5">
                ${timetables.map(t => `<span class="bg-slate-900 border border-slate-700 text-amber-300 text-xs font-black px-2 py-0.5 rounded-md">${t}</span>`).join('')}
              </div>
            </div>
          ` : ''}

          ${transInfo.Remarks || transInfo.Notes ? `<p class="text-xs text-slate-200 bg-slate-900/60 p-2 rounded-lg border border-slate-800">${transInfo.Remarks || transInfo.Notes}</p>` : ''}
        </div>

        <a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(routeParts[0])}&destination=${encodeURIComponent(routeParts[1]||'')}" target="_blank" class="w-full h-11 bg-amber-400 text-slate-950 font-black text-sm rounded-xl flex items-center justify-center gap-2 active:scale-95 transition shadow-lg my-1">
          <span>🗺️</span>
          <span>開啟 Google 路線導航</span>
        </a>
      `;

      document.getElementById('modal-grid').innerHTML = '';
      document.getElementById('modal-alerts').innerHTML = '';
      const actionsEl = document.getElementById('modal-actions');
      actionsEl.innerHTML = '';
      actionsEl.classList.add('hidden');

      showModal();
    }

    /* ----------------------------------------------------
       第三層：Lightbox 全螢幕預覽與 Modal 控制
    ---------------------------------------------------- */
    function openLightbox(src, caption = '') {
      if (!src) return;
      const overlay = document.getElementById('lightbox-overlay');
      const img = document.getElementById('lightbox-img');
      const captionEl = document.getElementById('lightbox-caption');

      img.src = src;
      captionEl.textContent = caption || '圖片預覽';
      overlay.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.remove('opacity-0');
        img.classList.remove('scale-95');
        img.classList.add('scale-100');
      }, 10);
    }

    function closeLightbox() {
      const overlay = document.getElementById('lightbox-overlay');
      const img = document.getElementById('lightbox-img');
      overlay.classList.add('opacity-0');
      img.classList.remove('scale-100');
      img.classList.add('scale-95');
      setTimeout(() => { overlay.classList.add('hidden'); img.src = ''; }, 200);
    }

    function showModal() {
      const overlay = document.getElementById('modal-overlay');
      const sheet = document.getElementById('modal-sheet');
      overlay.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.remove('opacity-0');
        sheet.classList.remove('translate-y-full');
      }, 10);
    }

    function closeModal(e) {
      if (e.target.id === 'modal-overlay') closeModalDirect();
    }

    function closeModalDirect() {
      modalHistory = [];
      currentModalItem = null;
      const overlay = document.getElementById('modal-overlay');
      const sheet = document.getElementById('modal-sheet');
      sheet.classList.add('translate-y-full');
      overlay.classList.add('opacity-0');
      setTimeout(() => { overlay.classList.add('hidden'); }, 200);
    }

    window.addEventListener('DOMContentLoaded', fetchLatestData);
  </script>
</body>
</html>
