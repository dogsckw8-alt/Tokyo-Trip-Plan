<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東京 7 日 6 夜旅行</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-card:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 select-none">

  <!-- 頂部 Header -->
  <header class="sticky top-0 bg-slate-950/95 backdrop-blur-md z-30 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-black text-amber-400 tracking-wide">⛩️ 東京 7 日 6 夜旅行</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="fetchLatestData()" class="flex items-center gap-1.5 bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-full active:scale-95 transition">
        <span id="sync-dot" class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="sync-text" class="text-xs text-slate-300 font-bold">已同步</span>
      </button>
    </div>
  </header>

  <!-- 日期導航列 -->
  <nav class="sticky top-[57px] bg-slate-950/95 backdrop-blur-md z-20 px-3 py-2 border-b border-slate-800">
    <div id="day-tabs" class="flex gap-2.5 overflow-x-auto no-scrollbar pb-1">
      <!-- 由 JS 動態生成 -->
    </div>
  </nav>

  <!-- 主內容區：貫穿式時間軸 -->
  <main class="max-w-md mx-auto px-4 pt-6 relative">
    <div class="absolute left-[39px] top-6 bottom-6 w-1 bg-slate-800 z-0"></div>
    <div id="timeline-container" class="space-y-6 relative z-10">
      <!-- 由 JS 動態生成 -->
    </div>
  </main>

  <!-- 二級彈窗：Bottom Sheet Modal -->
  <div id="modal-overlay" class="fixed inset-0 bg-black/80 z-50 flex flex-col justify-end hidden opacity-0 transition-opacity duration-200" onclick="closeModal(event)">
    <div id="modal-sheet" class="bg-slate-900 border-t border-slate-700 rounded-t-3xl p-5 max-h-[90vh] overflow-y-auto space-y-5 transform translate-y-full transition-transform duration-300 shadow-2xl" onclick="event.stopPropagation()">

      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto"></div>
        <button onclick="closeModalDirect()" class="text-slate-400 hover:text-white p-1 text-2xl font-bold">✕</button>
      </div>

      <!-- Header & Image Banner -->
      <div id="modal-header" class="space-y-2"></div>

      <!-- 核心網格 -->
      <div id="modal-grid" class="grid grid-cols-2 gap-3 text-slate-200"></div>

      <!-- 轉乘/行程分段明細（交通專用） -->
      <div id="modal-transit-steps" class="space-y-3 hidden"></div>

      <!-- 高亮提醒、故事、SubSpots、順遊下一站區域 -->
      <div id="modal-alerts" class="space-y-3"></div>

      <!-- 吸底動作按鈕列 -->
      <div id="modal-actions" class="sticky bottom-0 bg-slate-900 pt-3 pb-2 flex gap-3 z-10 border-t border-slate-800"></div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyPhyYaZhVCE3LyP7wfK_O3t3pACmjKHo53kET2F2K6YMf6DgyNWxcMxHGFVyIGkp7Nug/exec";

    let currentData = null;
    let selectedDayIndex = 0;

    const WEEK_DAYS = ['(日)', '(一)', '(二)', '(三)', '(四)', '(五)', '(六)'];
    const WEEK_KEYS = ['日', '一', '二', '三', '四', '五', '六'];

    async function fetchLatestData() {
      const dotEl = document.getElementById('sync-dot');
      const textEl = document.getElementById('sync-text');
      dotEl.className = "w-3 h-3 rounded-full bg-amber-400 animate-ping";
      textEl.textContent = "讀取中...";

      try {
        const res = await fetch(GAS_API_URL);
        const json = await res.json();
        console.log("1. API 原始回傳資料:", json);
        if (json.status === 'success') {
          currentData = json;
          console.log("2. 寫入後的 currentData:", currentData);
          dotEl.className = "w-3 h-3 rounded-full bg-emerald-400";
          textEl.textContent = "已同步";
          renderApp();
        } else {
          throw new Error(json.message);
        }
      } catch (err) {
        dotEl.className = "w-3 h-3 rounded-full bg-rose-500";
        textEl.textContent = "同步失敗";
        console.error(err);
      }
    }

    function renderApp() {
      if (!currentData || !currentData.schedule || !currentData.schedule.days.length) {
        document.getElementById('timeline-container').innerHTML = '<div class="text-center text-slate-400 py-12 text-lg">尚無行程資料</div>';
        return;
      }

      const days = currentData.schedule.days;

      const tabsNav = document.getElementById('day-tabs');
      tabsNav.innerHTML = days.map((dayStr, idx) => {
        const dateObj = new Date(dayStr);
        const dateShort = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
        const weekDay = WEEK_DAYS[dateObj.getDay()] || '';
        const isSelected = idx === selectedDayIndex;

        return `
          <button onclick="selectDay(${idx})" class="flex-shrink-0 px-4 py-2 rounded-2xl flex flex-col items-center transition-all ${
            isSelected 
              ? 'bg-amber-400 text-slate-950 font-black shadow-lg shadow-amber-400/20 scale-105' 
              : 'bg-slate-900 border border-slate-800 text-slate-300 font-bold'
          }">
            <span class="text-xs tracking-wider opacity-80">DAY ${idx + 1}</span>
            <span class="text-base font-black">${dateShort} ${weekDay}</span>
          </button>
        `;
      }).join('');

      renderTimeline(days[selectedDayIndex]);
    }

    function selectDay(index) {
      selectedDayIndex = index;
      renderApp();
    }

    // 停留時間與離開時間計算函數
    function parseDurationMins(durationVal) {
      if (!durationVal) return 60;
      const str = String(durationVal).trim();
      if (!str) return 60;
      
      if (str.includes('h') || str.includes('時')) {
        const num = parseFloat(str);
        return isNaN(num) ? 60 : Math.round(num * 60);
      }
      const match = str.match(/\d+/);
      return match ? parseInt(match[0], 10) : 60;
    }

    


// 尋找景點 A ➔ 景點 B 在 transports 資料庫中的移動紀錄
function getBetweenSpotsTransport(fromSpot, toSpot) {
  if (!currentData || !currentData.transports || !fromSpot || !toSpot) return null;
  
  const cleanFrom = getCleanSpotName(fromSpot);
  const cleanTo = getCleanSpotName(toSpot);
  const tMap = currentData.transports;

  // 1. 先用 key 嘗試比對 ("A➔B" 或 "A→B")
  if (tMap[`${cleanFrom}➔${cleanTo}`]) return tMap[`${cleanFrom}➔${cleanTo}`];
  if (tMap[`${cleanFrom}→${cleanTo}`]) return tMap[`${cleanFrom}→${cleanTo}`];

  // 2. 遍歷所有紀錄，比對 From 與 To 欄位
  for (const key in tMap) {
    const item = tMap[key];
    if (item && item.From && item.To) {
      if (item.From.trim() === cleanFrom && item.To.trim() === cleanTo) {
        return item;
      }
    }
  }
  return null;
}

    function calcDepartureTime(startTimeStr, durationMins) {
      if (!startTimeStr || !startTimeStr.includes(':')) return null;
      const [h, m] = startTimeStr.split(':').map(Number);
      if (isNaN(h) || isNaN(m)) return null;
      
      const totalMins = h * 60 + m + durationMins;
      const endH = Math.floor(totalMins / 60) % 24;
      const endM = totalMins % 60;
      
      const pad = n => String(n).padStart(2, '0');
      return `${pad(endH)}:${pad(endM)}`;
    }

    function formatMins(rawVal) {
      if (!rawVal && rawVal !== 0) return '移動中';
      const str = String(rawVal).trim();
      if (!str) return '移動中';
      if (str.toLowerCase().includes('min')) return str;
      return `${str} mins`;
    }

    function formatFeeDisplay(rawFee) {
      if (!rawFee && rawFee !== 0) return '';
      const str = String(rawFee).trim();
      if (str === '0' || str.toLowerCase().includes('pass') || str.includes('免')) {
        return '<span class="bg-emerald-950/80 border border-emerald-800 text-emerald-300 px-2.5 py-1 rounded-lg">🎫 Pass涵蓋 (¥0)</span>';
      }
      const numMatch = str.match(/\d+/);
      const val = numMatch ? numMatch[0] : str;
      return `<span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-lg">💰 交通票/IC卡 ¥${val}</span>`;
    }

    function formatHoursDisplay(hoursStr) {
      if (!hoursStr) return '請參考官方說明';
      const str = String(hoursStr).trim();
      if (!str) return '請參考官方說明';
      return str.replace(/(\d{1,2}:\d{2}\s*[-~～]\s*\d{1,2}:\d{2})[\s,;/]+(\d{1,2}:\d{2}\s*[-~～]\s*\d{1,2}:\d{2})/g, '$1\n$2');
    }

    function parseSubSpots(subSpotsStr) {
      if (!subSpotsStr) return [];
      return String(subSpotsStr)
        .split(/[,，、\n]/)
        .map(s => s.trim())
        .filter(Boolean);
    }

    function calcMultiLegTime(routeParts) {
      let total = 0;
      let legTimes = [];
      let hasValid = false;

      for (let i = 0; i < routeParts.length - 1; i++) {
        const from = routeParts[i];
        const to = routeParts[i + 1];
        const info = findTransportInfo(`${from}➔${to}`, [from, to]);
        const num = parseInt(info.Time || info.Duration || 0, 10);
        if (!isNaN(num) && num > 0) {
          total += num;
          legTimes.push(num);
          hasValid = true;
        }
      }

      if (hasValid && routeParts.length > 2) {
        return `${total} mins (${legTimes.join('+')})`;
      } else if (hasValid) {
        return `${total} mins`;
      }
      return null;
    }

    function calcMultiLegFee(routeParts) {
      let totalFee = 0;
      let hasValidFee = false;

      for (let i = 0; i < routeParts.length - 1; i++) {
        const from = routeParts[i];
        const to = routeParts[i + 1];
        const info = findTransportInfo(`${from}➔${to}`, [from, to]);
        
        if (info && info.Fee !== undefined && info.Fee !== null && String(info.Fee).trim() !== '') {
          const feeStr = String(info.Fee).trim();
          const numMatch = feeStr.match(/\d+/);
          if (numMatch) {
            totalFee += parseInt(numMatch[0], 10);
            hasValidFee = true;
          }
        }
      }

      return hasValidFee ? totalFee : null;
    }

    
// 1. 時間格式轉換工具 (轉換為當天總分鐘數)
function timeToMins(timeStr) {
  if (!timeStr || typeof timeStr !== 'string') return null;
  const match = timeStr.match(/(\d{1,2}):(\d{2})/);
  if (!match) return null;
  return parseInt(match[1], 10) * 60 + parseInt(match[2], 10);
}

// 2. 強化版多段式與關鍵字解析函數
function parseCellContent(rawString) {
  if (!rawString) return { spotName: '', subTitle: '', notice: '', openTime: null, queueTime: null, leaveTime: null };

  const parts = rawString.split('|').map(s => s.trim());
  const spotName = parts[0] || '';
  const subTitle = parts[1] || '';
  const notice = parts.slice(2).join(' ') || '';

  // 解析「營業/開店」時間 (例: 17:30營業)
  const openMatch = notice.match(/(\d{1,2}:\d{2})\s*(?:營業|開店|開門)/);
  // 解析「排隊/抵達/建議」時間 (例: 17:15排隊, 建議10:45抵達)
  const queueMatch = notice.match(/(\d{1,2}:\d{2})\s*(?:排隊|抵達|集合)?/);
  const hasQueueKeyword = /排隊|抵達|集合|建議/.test(notice);
  // 解析「離開」時間 (例: 13:30離開, 13:30前離開)
  const leaveMatch = notice.match(/(\d{1,2}:\d{2})\s*(?:前)?(?:必須)?離開/);

  const openTime = openMatch ? openMatch[1] : null;
  const leaveTime = leaveMatch ? leaveMatch[1] : null;

  let queueTime = null;
  // 只有在有排隊相關關鍵字，且該時間不等於營業/離開時間時採納
  if (hasQueueKeyword && queueMatch) {
    if (queueMatch[1] !== openTime && queueMatch[1] !== leaveTime) {
      queueTime = queueMatch[1];
    }
  }
  // 特殊情況：無「營業」關鍵字但寫了排隊 (例: 10:45排隊)
  if (!openTime && !leaveTime && queueMatch && (hasQueueKeyword || notice.includes('排隊'))) {
    queueTime = queueMatch[1];
  }

  return { spotName, subTitle, notice, openTime, queueTime, leaveTime };
}

// 3. 計算卡片時間與狀態徽章
function getCardStatusBadge({ slotTime, dbItem, parsedNotice, weekKey }) {
  const { notice, openTime, queueTime, leaveTime } = parsedNotice;
  const slotMins = timeToMins(slotTime);

  // 取得資料庫中的營業時間資訊
  const dbHoursStr = dbItem ? (dbItem[weekKey] || dbItem.Hours || dbItem.OpenTime || '') : '';
  const dbTimeMatch = dbHoursStr.match(/(\d{1,2}:\d{2})/);

  // 優先採用表格內明確寫的營業時間，若無則採用資料庫時間
  const finalOpenTime = openTime || (dbTimeMatch ? dbTimeMatch[1] : null);

  // 情況 A：含有「離開時間」提醒 (例: 13:30離開)
  if (leaveTime) {
    return `
      <span class="bg-rose-950/80 text-rose-300 border border-rose-800/60 text-xs font-bold px-2.5 py-1 rounded-lg flex items-center gap-1">
        ⚠️ ${leaveTime} 前須離開
      </span>
    `;
  }

  // 情況 B：含有「排隊 / 建議抵達時間」 (例: 17:30營業,17:15排隊 或 10:45排隊)
  if (queueTime) {
    return `
      <span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs font-bold px-2.5 py-1 rounded-lg flex items-center gap-1">
        🔥 ${finalOpenTime ? finalOpenTime + '開店 ' : ''}(建議 ${queueTime} 排隊)
      </span>
    `;
  }

  // 情況 C：單純營業時間提醒與網格時段比對
  const dbOpenMins = timeToMins(finalOpenTime);
  if (slotMins !== null && dbOpenMins !== null) {
    const diffMins = dbOpenMins - slotMins;

    if (diffMins >= 0 && diffMins <= 30) {
      return `
        <span class="bg-blue-950/80 text-blue-300 border border-blue-800/60 text-xs font-bold px-2.5 py-1 rounded-lg flex items-center gap-1">
          ℹ️ ${finalOpenTime} 開店
        </span>
      `;
    }

    if (diffMins > 30) {
      return `
        <span class="bg-rose-950/80 text-rose-300 border border-rose-800/60 text-xs font-bold px-2.5 py-1 rounded-lg flex items-center gap-1">
          ⚠️ ${finalOpenTime} 才開店
        </span>
      `;
    }
  }

  // 情況 D：無時間關鍵字的純文字注意事項
  if (notice) {
    return `
      <span class="bg-slate-800 text-amber-300 text-xs font-bold px-2.5 py-1 rounded-lg flex items-center gap-1">
        💡 ${notice}
      </span>
    `;
  }

  return '';
}
// 4. 順遊下一站模組 (已修正三段式字串純店名比對)
function renderNextStepModule(itemName, currentDayKey) {
  const timeline = currentData.schedule.timeline;
  const dayItems = timeline.filter(slot => slot.items[currentDayKey]);
  
  const cleanTargetName = getCleanSpotName(itemName);
  const currentIdx = dayItems.findIndex(slot => getCleanSpotName(slot.items[currentDayKey]) === cleanTargetName);

  if (currentIdx === -1 || currentIdx >= dayItems.length - 1) {
    return `
      <div class="bg-slate-800/40 p-3 rounded-xl border border-slate-800 text-center text-xs text-slate-400 font-bold">
        🏁 此站為本日行程最終站
      </div>
    `;
  }

  const nextSlot = dayItems[currentIdx + 1];
  const nextRawName = nextSlot.items[currentDayKey];
  const isNextTransport = nextRawName.includes('→') || nextRawName.includes('➔');

  if (isNextTransport) {
    const cleanRoute = getCleanSpotName(nextRawName);
    return `
      <div class="bg-amber-950/30 border border-amber-800/60 p-3.5 rounded-2xl space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-black text-amber-400 uppercase tracking-wider">⏭️ 順遊下一站（交通接駁）</span>
          <span class="text-xs font-bold text-slate-400">⏰ ${nextSlot.time} 出發</span>
        </div>
        <div class="flex items-center justify-between gap-2 pt-1">
          <div class="font-black text-white text-sm">🚌 ${cleanRoute}</div>
          <button onclick="openTransportModal('${cleanRoute}')" class="bg-amber-400 text-slate-950 text-xs font-black px-3 py-1.5 rounded-xl shadow active:scale-95 transition">
            查看路線 ➔
          </button>
        </div>
      </div>
    `;
  } else {
    const nextCleanName = getCleanSpotName(nextRawName);
    const nextDbItem = (currentData.restaurants && currentData.restaurants[nextCleanName]) || 
                       (currentData.attractions && currentData.attractions[nextCleanName]) || {};
    const icon = getItemIcon(nextDbItem.Type || nextDbItem['Rest.Type'], nextCleanName);

    return `
      <div class="bg-slate-800/90 border border-slate-700 p-3.5 rounded-2xl space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-black text-amber-400 uppercase tracking-wider">⏭️ 順遊下一站</span>
          <span class="text-xs font-bold text-slate-400">⏰ ${nextSlot.time} 到達</span>
        </div>
        <div class="flex items-center justify-between gap-2 pt-1">
          <div class="flex items-center gap-2">
            <span class="text-xl">${icon}</span>
            <div>
              <div class="font-black text-white text-sm leading-snug">${nextCleanName}</div>
              ${nextDbItem.District ? `<span class="text-[11px] font-bold text-slate-400">📍 ${nextDbItem.District}</span>` : ''}
            </div>
          </div>
          <button onclick="openDetailModal('${nextCleanName}', '${nextSlot.time}')" class="bg-slate-700 hover:bg-slate-600 text-amber-300 border border-amber-500/30 text-xs font-black px-3 py-1.5 rounded-xl active:scale-95 transition">
            開啟卡片 ➔
          </button>
        </div>
      </div>
    `;
  }
}

// 5. 時間軸主要渲染函數
function renderTimeline(currentDayKey) {
  console.log('正在渲染 Day:', currentDayKey);
  const container = document.getElementById('timeline-container');
  const timeline = currentData.schedule.timeline;
  const dayItems = timeline.filter(slot => slot.items[currentDayKey]);

  if (dayItems.length === 0) {
    container.innerHTML = '<div class="text-center text-slate-400 py-12 text-lg">☕ 本日尚無排定行程</div>';
    return;
  }

  // 取得當前星期的 key (如 "日", "一") 供營業時間比對使用
  const dateObj = new Date(currentDayKey);
  const WEEK_KEYS = ['日', '一', '二', '三', '四', '五', '六'];
  const weekKey = WEEK_KEYS[dateObj.getDay()] || '';

  container.innerHTML = dayItems.map((slot, idx) => {
    const rawName = slot.items[currentDayKey];
    const isTransport = rawName.includes('→') || rawName.includes('➔');

    // 分支 1：獨立交通格
    if (isTransport) {
      const cleanRoute = getCleanSpotName(rawName);
      const routeParts = cleanRoute.split(/→|➔/).map(p => p.trim());
      const isMultiLeg = routeParts.length > 2;

      const transInfo = findTransportInfo(cleanRoute, routeParts);

      let durationStr = isMultiLeg ? calcMultiLegTime(routeParts) : null;
      if (!durationStr) {
        durationStr = formatMins(transInfo.Time || transInfo.Duration);
      }

      let feeVal = transInfo.Fee;
      if (isMultiLeg) {
        const multiFee = calcMultiLegFee(routeParts);
        if (multiFee !== null) feeVal = multiFee;
      }

      const feeBadge = formatFeeDisplay(feeVal);

      return `
        <div class="flex items-start gap-3 relative z-10">
          <div class="w-12 pt-2 flex-shrink-0 text-right">
            <span class="text-xs font-black text-amber-400 bg-slate-900 px-1 py-0.5 rounded border border-amber-500/30">${slot.time}</span>
          </div>
          
          <div onclick="openTransportModal('${cleanRoute}')" class="touch-card flex-1 bg-slate-900/90 border border-amber-500/40 hover:border-amber-400 p-3.5 rounded-2xl shadow-md cursor-pointer transition active:scale-[0.98]">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="text-xl">🚌</span>
                <div>
                  <h3 class="text-base font-black text-amber-300 leading-snug">
                    ${routeParts.join(' ➔ ')}
                  </h3>
                  ${isMultiLeg ? `<span class="inline-block bg-indigo-950 text-indigo-300 text-[10px] font-bold px-2 py-0.5 rounded mt-1 border border-indigo-800">轉乘路線</span>` : ''}
                </div>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 mt-2 pt-2 border-t border-slate-800 text-xs font-bold text-slate-300">
              <span class="bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-lg">⏱️ ${durationStr}</span>
              ${feeBadge}
              ${transInfo.Line ? `<span class="bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg">🚇 ${transInfo.Line}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    // 分支 2：景點 / 餐廳 / 飯店
    const parsedNotice = parseCellContent(rawName);
    const { spotName, subTitle } = parsedNotice;

    const dbItem = (currentData.restaurants && currentData.restaurants[spotName]) || 
                   (currentData.attractions && currentData.attractions[spotName]) || {};

    // 左側時間標籤覆蓋邏輯：若有指定「排隊/建議抵達時間」，優先顯示排隊時間，否則顯示原本格子的時間
    const displayTime = parsedNotice.queueTime || slot.time;

}

    function findTransportInfo(fullRoute, routeParts) {
      if (!currentData.transports) return {};
      const tMap = currentData.transports;

      if (tMap[fullRoute]) return tMap[fullRoute];

      const from = routeParts[0];
      const to = routeParts[routeParts.length - 1];
      if (tMap[`${from}➔${to}`]) return tMap[`${from}➔${to}`];
      if (tMap[`${from}→${to}`]) return tMap[`${from}→${to}`];

      return {};
    }

    function parseTitles(rawName, dbItem) {
      let main = rawName;
      let sub = dbItem.Name || '';

      if (rawName.includes('(') || rawName.includes('（')) {
        main = rawName;
      } else if (dbItem.RestType || dbItem['Rest.Type']) {
        const type = dbItem.RestType || dbItem['Rest.Type'];
        if (type && !rawName.includes(type)) sub = `${type} · ${sub}`;
      }

      if (main === sub) sub = '';
      return { mainTitle: main, subTitle: sub };
    }

    function getItemIcon(type, name) {
      if (!type) {
        if (name.includes('機場')) return '✈️';
        if (name.includes('酒店') || name.includes('飯店') || name.includes('HOTEL') || name.includes('Guesthouse')) return '🏨';
        return '📍';
      }
      if (type.includes('Hotel') || type.includes('飯店') || type.includes('住宿')) return '🏨';
      if (type.includes('餐廳') || type.includes('燒肉') || type.includes('壽司')) return '🍴';
      if (type.includes('面包') || type.includes('甜點') || type.includes('咖啡')) return '☕';
      if (type.includes('Spot') || type.includes('景點') || type.includes('神社') || type.includes('商店街')) return '⛩️';
      if (type.includes('Mall') || type.includes('購物') || type.includes('outlet')) return '🛍️';
      return '📍';
    }

    function getReservationBadge(status) {
      if (!status) return '';
      if (status.includes('排隊') || status.includes('現場')) {
        return `<span class="bg-rose-950/80 border border-rose-800 text-rose-300 text-xs font-bold px-2.5 py-1 rounded-lg">🔴 現場排隊</span>`;
      }
      if (status.includes('預約') || status.includes('不用排')) {
        return `<span class="bg-emerald-950/80 border border-emerald-800 text-emerald-300 text-xs font-bold px-2.5 py-1 rounded-lg">🟢 已預約/不用排</span>`;
      }
      return `<span class="bg-amber-950/80 border border-amber-800 text-amber-300 text-xs font-bold px-2.5 py-1 rounded-lg">🟡 ${status}</span>`;
    }

    // 順遊下一站模組渲染器
    function renderNextStepModule(itemName, currentDayKey) {
      const timeline = currentData.schedule.timeline;
      const dayItems = timeline.filter(slot => slot.items[currentDayKey]);
      const currentIdx = dayItems.findIndex(slot => slot.items[currentDayKey] === itemName);

      if (currentIdx === -1 || currentIdx >= dayItems.length - 1) {
        return `
          <div class="bg-slate-800/40 p-3 rounded-xl border border-slate-800 text-center text-xs text-slate-400 font-bold">
            🏁 此站為本日行程最終站
          </div>
        `;
      }

      const nextSlot = dayItems[currentIdx + 1];
      const nextRawName = nextSlot.items[currentDayKey];
      const isNextTransport = nextRawName.includes('→') || nextRawName.includes('➔');

      if (isNextTransport) {
        const cleanRoute = nextRawName.split('|')[0].trim();
        return `
          <div class="bg-amber-950/30 border border-amber-800/60 p-3.5 rounded-2xl space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-black text-amber-400 uppercase tracking-wider">⏭️ 順遊下一站（交通接駁）</span>
              <span class="text-xs font-bold text-slate-400">⏰ ${nextSlot.time} 出發</span>
            </div>
            <div class="flex items-center justify-between gap-2 pt-1">
              <div class="font-black text-white text-sm">🚌 ${cleanRoute}</div>
              <button onclick="openTransportModal('${cleanRoute}')" class="bg-amber-400 text-slate-950 text-xs font-black px-3 py-1.5 rounded-xl shadow active:scale-95 transition">
                查看路線 ➔
              </button>
            </div>
          </div>
        `;
      } else {
        const nextDbItem = (currentData.restaurants && currentData.restaurants[nextRawName]) || 
                           (currentData.attractions && currentData.attractions[nextRawName]) || {};
        const icon = getItemIcon(nextDbItem.Type || nextDbItem['Rest.Type'], nextRawName);

        return `
          <div class="bg-slate-800/90 border border-slate-700 p-3.5 rounded-2xl space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-black text-amber-400 uppercase tracking-wider">⏭️ 順遊下一站</span>
              <span class="text-xs font-bold text-slate-400">⏰ ${nextSlot.time} 到達</span>

            <div class="flex items-center justify-between gap-2 pt-1">
              <div class="flex items-center gap-2">
                <span class="text-xl">${icon}</span>
                <div>
                  <div class="font-black text-white text-sm leading-snug">${nextRawName}</div>
                  ${nextDbItem.District ? `<span class="text-[11px] font-bold text-slate-400">📍 ${nextDbItem.District}</span>` : ''}
                </div>
              </div>
              <button onclick="openDetailModal('${nextRawName}', '${nextSlot.time}')" class="bg-slate-700 hover:bg-slate-600 text-amber-300 border border-amber-500/30 text-xs font-black px-3 py-1.5 rounded-xl active:scale-95 transition">
                開啟卡片 ➔
              </button>
            </div>
          </div>
        `;
      }
    }

        </a>
        ${menuUrl ? `
          <a href="${menuUrl}" target="_blank" class="w-1/3 h-12 bg-slate-800 border border-slate-700 text-slate-200 font-bold text-sm rounded-xl flex items-center justify-center gap-1 active:scale-95 transition">
            <span>📖</span>
            <span>菜單</span>
          </a>
        ` : ''}
      `;

      showModal();
    }

    function openTransportModal(fullRoute) {
      const routeParts = fullRoute.split(/→|➔/).map(p => p.trim());
      const isMultiLeg = routeParts.length > 2;

      document.getElementById('modal-header').innerHTML = `
        <h2 class="text-2xl font-black text-white flex items-center gap-2">
          <span>🚌</span> 路線指南
        </h2>
        <p class="text-lg text-amber-400 font-extrabold mt-1">${routeParts.join(' ➔ ')}</p>
      `;

      let segments = [];
      if (isMultiLeg) {
        for (let i = 0; i < routeParts.length - 1; i++) {
          const from = routeParts[i];
          const to = routeParts[i + 1];
          const info = findTransportInfo(`${from}➔${to}`, [from, to]);
          segments.push({ from, to, info });
        }
      } else {
        const from = routeParts[0];
        const to = routeParts[1] || '';
        const info = findTransportInfo(fullRoute, routeParts);
        segments.push({ from, to, info });
      }

      const stepsContainer = document.getElementById('modal-transit-steps');
      stepsContainer.classList.remove('hidden');

      stepsContainer.innerHTML = segments.map((seg, idx) => {
        const info = seg.info || {};
        const timeFormatted = formatMins(info.Time || info.Duration);
        const timetables = (info.Timetable || info['時刻表'] || '').split('/').filter(Boolean);
        const liveUrl = info.LiveUrl || info.Link2 || info['實時位置連結'];
        const routeTips = info.RouteTips || info.RouteGuide || info.WalkingTips || info['路線提示'];
        const videoUrl = info.VideoURL || info.Video;

        return `
          <div class="bg-slate-800/90 border border-slate-700 p-4 rounded-2xl space-y-2.5">
            <div class="flex justify-between items-center border-b border-slate-700/80 pb-2">
              <span class="text-xs font-black bg-amber-500/20 text-amber-300 px-2.5 py-0.5 rounded-md">第 ${idx + 1} 段移動</span>
              <span class="text-xs font-bold text-slate-400">⏱️ ${timeFormatted}</span>
            </div>

            <div class="text-base font-black text-white mt-1">
              ${seg.from} <span class="text-amber-400">➔</span> ${seg.to}
            </div>

            ${info.Platform || info.DeparturePlatform ? `
              <div class="text-xs text-amber-200 bg-amber-950/40 border border-amber-800/60 p-2 rounded-lg font-bold">
                🏣 乘車處/月台：${info.Platform || info.DeparturePlatform}
              </div>
            ` : ''}

            ${info.Line || info.RouteName ? `
              <div class="text-xs text-slate-300 font-bold">
                🚇 搭乘路線：<span class="text-white">${info.Line || info.RouteName}</span>
              </div>
            ` : ''}

            ${routeTips ? `
              <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-700/80">
                <p class="text-xs font-black text-amber-400 mb-1 flex items-center gap-1">🚶 步行/防迷路文字指引</p>
                <p class="text-xs text-slate-200 leading-relaxed font-medium whitespace-pre-line">${routeTips}</p>
              </div>
            ` : ''}

            ${videoUrl ? `
              <div class="pt-1">
                <a href="${videoUrl}" target="_blank" class="w-full py-2 bg-sky-950/80 hover:bg-sky-900 border border-sky-700 text-sky-200 text-xs font-black rounded-xl flex items-center justify-center gap-1.5 transition">
                  <span>▶️</span> 觀看實景走法影片 (YouTube)
                </a>
              </div>
            ` : ''}

            ${timetables.length > 0 ? `
              <div class="pt-1">
                <p class="text-[11px] font-bold text-slate-400 mb-1">⏰ 建議班次時刻表：</p>
                <div class="flex flex-wrap gap-1.5">
                  ${timetables.map(t => `<span class="bg-slate-900 border border-slate-700 text-amber-300 text-xs font-black px-2 py-0.5 rounded">${t}</span>`).join('')}
                </div>
              </div>
            ` : ''}

            ${info.Remarks || info.Notes ? `
              <p class="text-xs text-slate-300 bg-slate-900/60 p-2 rounded-lg border border-slate-800 font-medium">💬 備註：${info.Remarks || info.Notes}</p>
            ` : ''}

            ${liveUrl ? `
              <div class="pt-1">
                <a href="${liveUrl}" target="_blank" class="inline-flex items-center gap-1 text-xs text-sky-400 hover:text-sky-300 font-bold underline">
                  🔗 查看實時交通位置
                </a>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      document.getElementById('modal-grid').innerHTML = '';
      document.getElementById('modal-alerts').innerHTML = '';

      const mainNavUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(routeParts[0])}&destination=${encodeURIComponent(routeParts[routeParts.length - 1])}`;

      document.getElementById('modal-actions').innerHTML = `
        <a href="${mainNavUrl}" target="_blank" class="w-full h-12 bg-amber-400 text-slate-950 font-black text-base rounded-xl flex items-center justify-center gap-2 active:scale-95 transition shadow-lg">
          <span>🗺️</span>
          <span>開啟 Google 路線導航</span>
        </a>
      `;

      showModal();
    }

    function showModal() {
      const overlay = document.getElementById('modal-overlay');
      const sheet = document.getElementById('modal-sheet');
      overlay.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.remove('opacity-0');
        sheet.classList.remove('translate-y-full');
      }, 10);
    }
// 清理景點名稱（去掉 | 之後的說明）
function getCleanSpotName(rawName) {
  if (!rawName) return '';
  return rawName.split('|')[0].trim();
}
    function closeModal(e) {
      if (e.target.id === 'modal-overlay') closeModalDirect();
    }

    function closeModalDirect() {
      const overlay = document.getElementById('modal-overlay');
      const sheet = document.getElementById('modal-sheet');
      sheet.classList.add('translate-y-full');
      overlay.classList.add('opacity-0');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 200);
    }

    window.addEventListener('DOMContentLoaded', fetchLatestData);
  </script>
</body>
